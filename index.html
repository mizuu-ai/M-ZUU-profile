<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--accent:#7c5cff;--text:#fff;--muted:#b9b9c7}
html,body{min-height:100%;font-family:Inter,system-ui,sans-serif;color:var(--text)}
body{min-height:100vh;overflow-x:hidden;background:#09090d}
body:before{content:"";position:fixed;inset:0;z-index:-3;background:linear-gradient(rgba(5,5,8,.52),rgba(5,5,8,.72)),url("assets/profile.jpg") center/cover no-repeat;filter:saturate(.9);transform:scale(1.04)}
body:after{content:"";position:fixed;inset:-20%;z-index:-2;pointer-events:none;background-image:radial-gradient(rgba(255,255,255,.12) 1px,transparent 1px);background-size:38px 38px;opacity:.13;animation:drift 25s linear infinite}
@keyframes drift{to{transform:translate3d(38px,38px,0)}}
.wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px 16px}
.card{width:min(520px,100%);text-align:center;padding:30px 22px 24px;border:1px solid rgba(255,255,255,.14);border-radius:28px;background:rgba(13,13,20,.62);backdrop-filter:blur(22px);box-shadow:0 30px 80px rgba(0,0,0,.55);animation:enter .8s ease both}
@keyframes enter{from{opacity:0;transform:translateY(24px) scale(.98)}to{opacity:1;transform:none}}
.avatar{width:112px;height:112px;border-radius:50%;object-fit:cover;border:3px solid rgba(255,255,255,.85);box-shadow:0 0 0 8px rgba(124,92,255,.12),0 0 35px rgba(124,92,255,.35)}
h1{font-size:32px;margin-top:18px;letter-spacing:-.8px}.handle{color:var(--muted);margin-top:4px;font-size:14px}.bio{max-width:390px;margin:14px auto 20px;line-height:1.55;color:#dddde7;font-size:15px}
.socials{display:flex;justify-content:center;gap:10px;margin:0 0 18px;flex-wrap:wrap}
.socials a{width:42px;height:42px;display:grid;place-items:center;border-radius:50%;color:white;text-decoration:none;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);transition:.2s}
.socials a:hover{transform:translateY(-3px);border-color:rgba(255,255,255,.3);background:rgba(255,255,255,.13)}
.links{display:grid;gap:12px}.link{min-height:58px;display:flex;align-items:center;gap:13px;padding:0 18px;color:#fff;text-decoration:none;border-radius:17px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);transition:.22s;position:relative;overflow:hidden}
.link:hover{transform:translateY(-2px) scale(1.01);border-color:rgba(124,92,255,.55);box-shadow:0 10px 28px rgba(0,0,0,.2)}.link .emoji{font-size:20px;width:25px}.link span:last-child{flex:1;text-align:center;margin-right:25px;font-weight:600}
.bottom{display:flex;justify-content:space-between;align-items:center;margin-top:18px;color:#9292a1;font-size:12px}.music{border:0;cursor:pointer;color:white;background:rgba(255,255,255,.08);padding:9px 13px;border-radius:999px}.footer{margin-top:18px;color:#666675;font-size:11px}
@media(max-width:480px){.card{padding:26px 15px 20px;border-radius:23px}.avatar{width:96px;height:96px}h1{font-size:28px}.link{min-height:55px}}
</style>

<script>
const audio=document.getElementById("audio"),btn=document.getElementById("musicBtn");
btn.addEventListener("click",async()=>{try{if(audio.paused){await audio.play();btn.textContent="⏸ Music"}else{audio.pause();btn.textContent="▶ Music"}}catch(e){btn.textContent="Add music.mp3"}});
const key="masud_profile_views",count=Number(localStorage.getItem(key)||0)+1;
localStorage.setItem(key,count);
